<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>MultiTwitch Player</title>
  <script src="https://player.twitch.tv/js/embed/v1.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; background: #000; color: #fff;
      font-family: Arial, sans-serif; overflow: hidden; height: 100vh; width: 100vw;
    }
    #grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      width: 100vw;
      height: 100vh;
      gap: 2px;
      background: #111;
    }
    .player-wrapper {
      background: #000;
    }
    .player-wrapper iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
    }
    .empty-msg {
      display: flex; justify-content: center; align-items: center;
      height: 100vh; color: #666; font-size: 18px; text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="grid"></div>

  <script>
    const playerCache = {};

    function getParams() {
      const hash = window.location.hash.replace(/^#/, '');
      const search = window.location.search.replace(/^\?/, '');
      return new URLSearchParams(hash || search);
    }

    function getBestGrid(N, screenW, screenH) {
      if (N <= 0) return { cols: 1, rows: 1 };
      let bestArea = 0;
      let bestCols = 1;
      let bestRows = N;
      const targetAspect = 16 / 9;

      for (let cols = 1; cols <= N; cols++) {
        const rows = Math.ceil(N / cols);
        const cellW = screenW / cols;
        const cellH = screenH / rows;

        let vW = cellW;
        let vH = cellW / targetAspect;
        if (vH > cellH) {
          vH = cellH;
          vW = cellH * targetAspect;
        }
        const area = vW * vH;

        if (area > bestArea) {
          bestArea = area;
          bestCols = cols;
          bestRows = rows;
        }
      }
      return { cols: bestCols, rows: bestRows };
    }
