<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>MultiTwitch Player</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; background: #000; color: #fff;
      font-family: Arial, sans-serif; overflow: hidden; height: 100vh; width: 100vw;
    }
    #grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      width: 100vw;
      height: 100vh;
      gap: 2px;
      background: #111;
    }
    iframe {
      border: none;
      background: #000;
    }
    .empty-msg {
      display: flex; justify-content: center; align-items: center;
      height: 100vh; color: #666; font-size: 18px; text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="grid"></div>

  <script>
    const iframeCache = {};

    function getParams() {
      const hash = window.location.hash.replace(/^#/, '');
      const search = window.location.search.replace(/^\?/, '');
      return new URLSearchParams(hash || search);
    }

    function getBestGrid(N, screenW, screenH) {
      if (N <= 0) return { cols: 1, rows: 1 };
      let bestArea = 0;
      let bestCols = 1;
      let bestRows = N;
      const targetAspect = 16 / 9;

      for (let cols = 1; cols <= N; cols++) {
        const rows = Math.ceil(N / cols);
        const cellW = screenW / cols;
        const cellH = screenH / rows;

        let vW = cellW;
        let vH = cellW / targetAspect;
        if (vH > cellH) {
          vH = cellH;
          vW = cellH * targetAspect;
        }
        const area = vW * vH;

        if (area > bestArea) {
          bestArea = area;
          bestCols = cols;
          bestRows = rows;
        }
      }
      return { cols: bestCols, rows: bestRows };
    }

    function updateGrid() {
      const params = getParams();
      const screenType = params.get('screen') || '1';
      const channelsParam = params.get('channels') || '';
      const newChannels = channelsParam.split(',').filter(Boolean);
      const grid = document.getElementById('grid');

      if (screenType === '1') {
        document.title = newChannels.length > 0 ? "🔴 Imposter & Favoriten" : "🔴 Screen 1 (Leer)";
      } else {
        document.title = newChannels.length > 0 ? "🟢 Crewmates" : "🟢 Screen 2 (Leer)";
      }

      if (newChannels.length === 0) {
        Object.keys(iframeCache).forEach(name => {
          iframeCache[name].remove();
          delete iframeCache[name];
        });
        grid.innerHTML = `<div class="empty-msg">Keine aktiven Streams für Bildschirm ${screenType} ausgewählt.</div>`;
        return;
      }

      const emptyMsg = grid.querySelector('.empty-msg');
      if (emptyMsg) emptyMsg.remove();

      const count = newChannels.length;
      const screenW = window.innerWidth;
      const screenH = window.innerHeight;
      
      const { cols, rows } = getBestGrid(count, screenW, screenH);
      const gap = 2;
      const itemWidth = `calc((100% - ${(cols - 1) * gap}px) / ${cols})`;
      const itemHeight = `calc((100% - ${(rows - 1) * gap}px) / ${rows})`;
      const hostDomain = window.location.hostname || "localhost";

      // Entferne gelöschte Streams
      Object.keys(iframeCache).forEach(name => {
        if (!newChannels.includes(name)) {
          iframeCache[name].remove();
          delete iframeCache[name];
        }
      });

      // Erstelle/Aktualisiere Stream-iFrames
      newChannels.forEach((name, index) => {
        if (!iframeCache[name]) {
          const iframe = document.createElement('iframe');
          iframe.src = `https://player.twitch.tv/?channel=${name}&parent=${hostDomain}&muted=true&autoplay=true`;
          iframe.allow = "autoplay; fullscreen";
          iframe.allowFullscreen = true;
          
          // Versucht nach dem Laden automatisch die Auflösung zu begrenzen
          iframe.addEventListener('load', () => {
            setTimeout(() => {
              try {
                iframe.contentWindow.postMessage(JSON.stringify({
                  eventName: 'setQuality',
                  params: '480p30'
                }), '*');
              } catch (e) {}
            }, 2000);
          });

          iframeCache[name] = iframe;
          grid.appendChild(iframe);
        }
        
        const iframe = iframeCache[name];
        iframe.style.width = itemWidth;
        iframe.style.height = itemHeight;
        iframe.style.order = index; 
      });
    }

    window.addEventListener('hashchange', updateGrid);
    window.addEventListener('resize', updateGrid);
    window.addEventListener('load', updateGrid);
  </script>
</body>
</html>
