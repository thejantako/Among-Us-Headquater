<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>MultiTwitch Player</title>
  <style>
    body {
      margin: 0; padding: 0; background: #000; color: #fff;
      font-family: Arial, sans-serif; overflow: hidden; height: 100vh;
    }
    #grid {
      display: grid; width: 100vw; height: 100vh; gap: 2px;
      background: #111;
    }
    iframe { width: 100%; height: 100%; border: none; }
    .empty-msg {
      display: flex; justify-content: center; align-items: center;
      height: 100vh; color: #666; font-size: 18px; text-align: center;
    }
  </style>
</head>
<body>
  <div id="grid"></div>

  <script>
    // Cache speichert bereits geladene Stream-Iframes
    const iframeCache = {};

    function getParams() {
      const hash = window.location.hash.replace(/^#/, '');
      const search = window.location.search.replace(/^\?/, '');
      return new URLSearchParams(hash || search);
    }

    function updateGrid() {
      const params = getParams();
      const screenType = params.get('screen') || '1';
      const channelsParam = params.get('channels') || '';
      const newChannels = channelsParam.split(',').filter(Boolean);
      const grid = document.getElementById('grid');

      // Dynamische Tab-Titel
      if (screenType === '1') {
        document.title = newChannels.length > 0 ? "🔴 Imposter & Favoriten" : "🔴 Screen 1 (Leer)";
      } else {
        document.title = newChannels.length > 0 ? "🟢 Crewmates" : "🟢 Screen 2 (Leer)";
      }

      // Wenn keine Kanäle ausgewählt sind
      if (newChannels.length === 0) {
        Object.keys(iframeCache).forEach(name => {
          iframeCache[name].remove();
          delete iframeCache[name];
        });
        grid.innerHTML = `<div class="empty-msg">Keine aktiven Streams für Bildschirm ${screenType} ausgewählt.</div>`;
        return;
      }

      const emptyMsg = grid.querySelector('.empty-msg');
      if (emptyMsg) emptyMsg.remove();

      // Grid-Raster berechnen
      const count = newChannels.length;
      const cols = Math.ceil(Math.sqrt(count));
      const rows = Math.ceil(count / cols);
      grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

      const hostDomain = window.location.hostname;

      // 1. Streams entfernen, die nicht mehr in diesem Fenster sind
      Object.keys(iframeCache).forEach(name => {
        if (!newChannels.includes(name)) {
          iframeCache[name].remove();
          delete iframeCache[name];
        }
      });

      // 2. Neue Streams einfügen & bestehende Streams per CSS 'order' sortieren (OHNE Reload!)
      newChannels.forEach((name, index) => {
        if (!iframeCache[name]) {
          const iframe = document.createElement('iframe');
          iframe.src = `https://player.twitch.tv/?channel=${name}&parent=${hostDomain}&muted=true`;
          iframe.allowFullscreen = true;
          iframeCache[name] = iframe;
          grid.appendChild(iframe);
        }
        
        // Verschiebt das Video optisch im Raster, ohne das Iframe neu zu laden
        iframeCache[name].style.order = index;
      });
    }

    // Lauscht auf Hash-Änderungen (#screen=...&channels=...)
    window.addEventListener('hashchange', updateGrid);
    window.addEventListener('load', updateGrid);
  </script>
</body>
</html>
